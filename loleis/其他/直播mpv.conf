# 基础设置
profile=default
keep-open=yes
save-position-on-quit=no
osc=yes
osd-bar=yes

# ===== 点播 profile（默认生效） =====
[点播]
profile-desc=用于普通视频文件/网络点播
demuxer-max-bytes=0     # 不限制解复用器缓存大小（由下面cache控制）
demuxer-max-back-bytes=0
demuxer-readahead-secs=3  # 预读3秒（适合点播缓冲）
cache=yes
cache-secs=10            # 缓存10秒（默认是无限）
cache-pause-initial=no
cache-pause-wait=no

# ===== 直播 profile（手动指定或自动匹配） =====
[直播]
profile-desc=用于m3u8/rtmp直播流
demuxer-max-bytes=2097152   # 只缓存2MB（防止卡死）
demuxer-max-back-bytes=0
demuxer-readahead-secs=0     # 不预读
cache=no                    # 完全关闭缓存（关键！）
cache-secs=0
demuxer-readahead-secs=0
stream-buffer-size=0K       # 流缓冲为0
vd-lavc-threads=0           # 自动线程（可省略）
video-sync=display-resample # 显示同步，防止音画不同步
audio-buffer=0.1            # 极短音频缓冲