/* ===== 苹果白主题专属：底部导航栏 + 播放按钮，内置七彩流光呼吸 =====
   只加效果，不改原有形状：.chips 还是胶囊长条，.ed-play 还是圆角长条。
   做法：用 ::before 放一层模糊的七彩渐变（在元素内部、被圆角裁掉多余部分），
   ::after 盖一层半透明白让效果显得含蓄，真正的图标/文字再用 z-index 提到最上层。 */
@keyframes appletvRainbowFlowX { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
@keyframes appletvRainbowBreatheBar { 0%, 100% { opacity: .4; transform: scale(1); } 50% { opacity: .78; transform: scale(1.03); } }
@keyframes appletvRainbowSpin { from { filter: blur(20px) hue-rotate(0deg); } to { filter: blur(20px) hue-rotate(360deg); } }
@keyframes appletvRainbowBreatheSoft { 0%, 100% { opacity: .26; transform: scale(.9); } 50% { opacity: .52; transform: scale(1.04); } }

/* 导航栏：七彩左右均匀分布 + 缓慢流动 + 呼吸（对应预览里的 B-2 方案） */
:root[data-theme="appletv"] .chips {
  position: fixed; overflow: hidden;
  background: rgba(255, 255, 255, .55);
}
:root[data-theme="appletv"] .chips::before {
  content: ""; position: absolute; inset: -60% 0; z-index: 0; pointer-events: none;
  background: linear-gradient(90deg, #ff3b3b, #ff9d3b, #ffe23b, #3bff6a, #3bd4ff, #7a3bff, #ff3bbf, #ff3b3b);
  background-size: 200% 100%; filter: blur(18px);
  animation: appletvRainbowFlowX 6s ease-in-out infinite, appletvRainbowBreatheBar 3s ease-in-out infinite;
}
:root[data-theme="appletv"] .chips::after {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: rgba(255, 255, 255, .7);
}
:root[data-theme="appletv"] .chip { position: relative; z-index: 1; }

/* 播放按钮：保持长条形状与原有布局，仅把内部换成七彩微呼吸（关掉原本的蓝色流光，避免叠加） */
:root[data-theme="appletv"] .ed-play {
  position: relative; overflow: hidden; animation: none;
  background: rgba(255, 255, 255, .92);
}
:root[data-theme="appletv"] .ed-play::before {
  content: ""; position: absolute; inset: -40%; z-index: 0; pointer-events: none;
  background: conic-gradient(from 0deg, #ff3b3b, #ff9d3b, #ffe23b, #3bff6a, #3bd4ff, #7a3bff, #ff3bbf, #ff3b3b);
  animation: appletvRainbowSpin 6s linear infinite, appletvRainbowBreatheSoft 4s ease-in-out infinite;
}
:root[data-theme="appletv"] .ed-play::after {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: rgba(255, 255, 255, .8);
}
:root[data-theme="appletv"] .ed-play .tri,
:root[data-theme="appletv"] .ed-play #edPlayLabel {
  position: relative; z-index: 1;
}
@media (prefers-reduced-motion: reduce) {

.mh-more { font-size: 13px; font-weight: 700; color: var(--accent); background: none; border: 0; display: inline-flex; align-items: center; gap: 2px; padding: 2px 0; }
.mh-more:active { opacity: .6; }
.mh-row { display: flex; gap: var(--card-gut); overflow-x: auto; padding: 0 var(--card-gut) 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.mh-row::-webkit-scrollbar { display: none; }
.mh-row .card { width: 128px; flex: 0 0 auto; margin: 0; }
/* 继续观看：横版剧照比例（16:9），而不是竖版海报比例 */
.mh-row-recent .card { width: 208px; }
.mh-row-recent .poster { padding-top: 56.25%; }
.mh-row-recent .poster img { object-position: center 25%; }
.grid.grid-recent { grid-template-columns: repeat(2, 1fr); }
.grid-recent .poster { padding-top: 56.25%; }
.grid-recent .poster img { object-position: center 25%; }
@media (min-width: 600px) { .grid.grid-recent { grid-template-columns: repeat(3, 1fr); } }
.mh-row-empty { padding: 4px var(--gut); color: var(--ink-faint); font-size: 12.5px; }
/* 分类页头 */
/* 分类页头：原来写死纯黑（#000000），跟首页/详情页现在都跟着海报自动变色的暖色调背景放一起，
   顶上突兀地卡一条黑条，很显眼很尴尬。改成跟 --dyn-bg-rgb 同色系的半透明磨砂条——颜色跟着
   当前页面的主题色走，同时留一点模糊（backdrop-filter）方便下面滚动的内容衬着文字看得清，
   观感上就是"同一块背景延伸上去"，而不是另外扣一块黑色盖子上去。 */
.cat-head { display: flex; align-items: center; gap: 8px; padding: calc(var(--safe-top) + 8px) var(--gut) 8px;
  position: sticky; top: 0; z-index: 20;
  background: rgba(var(--dyn-bg-rgb, 0,0,0), .82);
  -webkit-backdrop-filter: blur(20px) saturate(1.15);
  backdrop-filter: blur(20px) saturate(1.15); }
.cat-back { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: var(--ink); outline: none; -webkit-tap-highlight-color: transparent; }
.cat-back::-moz-focus-inner { border: 0; }
.cat-back:active { transform: scale(.92); }
.cat-title { font-size: 18px; font-weight: 800; flex: 0 0 auto; max-width: 40%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tv-mode .cat-back.focus, .tv-mode .cat-back:focus { box-shadow: 0 0 0 2px var(--accent); }
.hero-wrap { position: relative; }
.hero-wrap[hidden] { display: none; }
.hero { position: relative; width: 100%; height: 58vh; min-height: 340px; max-height: 560px; overflow: hidden; margin: 0 0 6px; background: var(--sheet-bg); }
.hero:empty { display: none; }
@media (orientation: landscape) { .hero { height: 85vh; min-height: 280px; } }
.hero-track { display: flex; height: 100%; transition: transform .5s cubic-bezier(.4, 0, .2, 1); will-change: transform; }
.hero-slide { position: relative; flex: 0 0 100%; height: 100%; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
.hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
.hero-shade { position: absolute; inset: 0; background:
  linear-gradient(to top, rgba(var(--dyn-bg-rgb), .12) 0%, rgba(var(--dyn-bg-rgb), .05) 30%, transparent 55%, rgba(var(--dyn-bg-rgb), .30) 100%),
  linear-gradient(to bottom, rgba(var(--dyn-bg-rgb), .55) 0%, transparent 26%); }
/* 底部融合层：不是拿一块纯色硬盖上去（那样不管颜色多准，照片的清晰细节和纯色之间还是有一条能看出来的边），
   而是用 backdrop-filter 把这块区域"背后的图"本身模糊掉，再叠一层从透明到接近实色的动态色渐变——
   越往下越糊、越往下颜色越重，模糊+调色是同步渐进的，所以看不出"从这里开始模糊/从这里开始变色"的分界线。
   最底部渐变到 .94 的不透明度，正好接近下方页面 --dyn-bg 的实色，和页面背景连成一片。
   自身再用 mask-image 做一次由上到下的显现渐变，让这层"变糊变色"的过渡本身也是渐进出现的，不是一整块突然出现。 */
.hero-blend {
  position: absolute; left: 0; right: 0; bottom: 0; height: 48%; pointer-events: none;
  -webkit-backdrop-filter: blur(36px) saturate(1.12);
  backdrop-filter: blur(36px) saturate(1.12);
  /* 之前最后一档停在 .99，留了 1% 的模糊照片透出来；理论上采样色已经很接近，但只要有一丝丝
     色差，这 1% 漏出来的照片色调就会在贴底那条线上露一点点马脚。这里从 92% 开始就直接铺满
     纯色（1），留出一段"纯色平台"接到页面背景，交界处彻底是同一个颜色，不再有任何照片像素
     透出来搅局。 */
  background: linear-gradient(to bottom, rgba(var(--dyn-bg-rgb), 0) 0%, rgba(var(--dyn-bg-rgb), .4) 40%, rgba(var(--dyn-bg-rgb), .82) 74%, rgba(var(--dyn-bg-rgb), 1) 92%, rgba(var(--dyn-bg-rgb), 1) 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.35) 26%, #000 62%);
  mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.35) 26%, #000 62%);
}
.hero-info { position: relative; z-index: 1; padding: 0 20px 36px; text-align: center; }

/* ============================================================
   首页轮播「异步滑动」视差（自 emby 首页移植）
   目标：下滑时只有海报图(.hero-bg)慢半拍上移，.hero-shade / .hero-blend / .hero-info
   全部保持页面常速、和下面的内容行一起走 —— 融合渐变便会自下而上把慢下来的海报逐渐"淹没"，
   出现景深分层感；而信息文字始终贴着内容，不会脱节割裂。

   为什么用滚动驱动动画(animation-timeline)而不是 JS 监听 scroll 写 transform：
   滚动本身跑在合成器线程，JS 改 transform 跑在主线程，海报位置永远比内容慢一帧 → 肉眼可见抖动，
   这是原理性的，调参数消不掉。绑到滚动时间轴上则整条动画由浏览器在合成器线程驱动，与滚动同帧。

   ⚠ 两个坑（都已避开）：
   1) 时间轴用 scroll(root block) —— 本页是「整个窗口」在滚（window.scrollTo/pageYOffset），
      根滚动器就是文档。这里绝不能用 scroll(nearest)：.hero 和 .hero-slide 都带 overflow:hidden，
      它们本身就算"滚动容器"，nearest 会命中它们，而它们根本不滚 → 进度恒为 0 → 完全没效果。
   2) 位移只加在 .hero-bg 上，绝不碰 .hero-track —— 那一层的 transform 是轮播左右翻页在用的，
      动它会把轮播搞坏。
   ============================================================ */
@supports (animation-timeline: scroll()) {
  /* 动画区间要知道 hero 实际高度：用与 .hero 完全相同的算式复刻（含 min/max-height → clamp） */
  .hero { --hero-h: clamp(340px, 58vh, 560px); }
  @media (orientation: landscape) { .hero { --hero-h: clamp(280px, 85vh, 560px); } }

  /* 海报：慢速下压(视差) + 极轻微推近(景深)。整条动画在合成器上跑，带 scale 也依然丝滑 */
  @keyframes heroParallax {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(0, calc(var(--hero-h, 58vh) * .42), 0) scale(1.06); }
  }
  /* 信息层：前 30% 完全不动、保持清晰，之后随滚动优雅淡出（只改透明度、不改位移，
     所以依旧与内容同速，不会重现"脱节"的割裂感） */
  @keyframes heroInfoFade {
    0%, 30% { opacity: 1; }
    100%    { opacity: 0; }
  }
  /* 注意声明顺序：animation 简写会把 animation-timeline 重置为 auto，
     所以 animation-timeline / animation-range 必须写在简写「之后」，否则又变成不动。 */
  .hero-bg {
    animation: heroParallax linear both;
    animation-timeline: scroll(root block);
    animation-range: 0px var(--hero-h, 58vh);
    will-change: transform; backface-visibility: hidden;
  }
  .hero-info {
    animation: heroInfoFade linear both;
    animation-timeline: scroll(root block);
    animation-range: 0px calc(var(--hero-h, 58vh) * .78);
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-bg { animation: none; }
    .hero-info { animation: none; opacity: 1; }
  }
}
.hero-title-wrap { display: flex; justify-content: center; }
.hero-title { font-size: 30px; font-weight: 900; letter-spacing: -.02em; line-height: 1.08; text-shadow: 0 2px 18px rgba(0,0,0,.55); max-width: 90%; margin: 0 auto 10px; }
.hero-logo { display: block; max-width: 74%; max-height: 84px; width: auto; height: auto; margin: 0 auto 12px; object-fit: contain; filter: drop-shadow(0 4px 16px rgba(0,0,0,.6)); }
.hero-meta { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ink-dim); text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.hero-meta { color: #d8def0; }
.hero-ov { margin: 9px auto 0; font-size: 13px; color: #c7cddf; line-height: 1.55; max-width: 94%; text-shadow: 0 1px 6px rgba(0,0,0,.6); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }
/* 横版（手机横屏）时轮播信息改左对齐：标题、徽标、元信息、简介都靠左，不再居中，
   跟竖版是两套独立的对齐方式，互不影响。 */
@media (orientation: landscape) {
  .hero-info { text-align: left; }
  .hero-title-wrap { justify-content: flex-start; }
  .hero-title { margin: 0 0 10px; max-width: 60%; }
  .hero-logo { margin: 0 0 12px; }
  .hero-meta { justify-content: flex-start; }
  .hero-ov { margin: 9px 0 0; max-width: 60%; }
}
/* 轮播指示器（圆点） */
.hero-dots { position: absolute; left: 0; right: 0; bottom: 13px; z-index: 4; display: flex; align-items: center; justify-content: center; gap: 6px; pointer-events: none; }
.hero-dots:empty { display: none; }
.hero-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.4); box-shadow: 0 1px 4px rgba(0,0,0,.4); transition: width .25s ease, background-color .25s ease, opacity .25s ease; }
.hero-dot.on { width: 16px; background: #fff; }
.chips { position: fixed; left: 50%; bottom: calc(10px + var(--safe-bottom)); transform: translateX(-50%);
  width: auto; max-width: 94%; display: inline-flex; align-items: center; gap: 2px; justify-content: center; z-index: 45;
  background: rgba(18, 26, 54, 0.62); -webkit-backdrop-filter: blur(24px) saturate(1.7); backdrop-filter: blur(24px) saturate(1.7);
  border: 1px solid rgba(160, 190, 255, 0.16); border-radius: 999px; padding: 5px 7px; overflow: visible;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.10);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.chip { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  padding: 7px 22px; border-radius: 999px; background: none; border: 0; color: var(--ink-dim); font-size: 10px; font-weight: 700; white-space: nowrap; transition: color .16s, background .16s;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.chip .chip-ico { width: 23px; height: 23px; display: block; }
.chip[data-nav="settings"] .chip-ico { width: 22px; height: 22px; }
.chip.active { background: var(--accent-soft); color: var(--accent); }
.chip:active { transform: scale(.94); }
.tv-mode .chip.focus, .tv-mode .chip:focus { box-shadow: 0 0 0 2px var(--accent); }
/* 给内容留出底栏空间；详情/设置打开时隐藏底栏 */
main { padding-bottom: calc(78px + var(--safe-bottom)); }
body.detail-active .chips { display: none; }
.chips::-webkit-scrollbar { display: none; }
/* 二级类型筛选 chips：横向滑动这里不再自己用 JS 接管 touchmove 手搓惯性/橡皮筋——
   之前 touch-action: none 会把这块区域的滚动完全交给 JS 主线程处理，每一帧 touchmove
   都要走一遍 JS（还强制 preventDefault），走不了浏览器/系统那条硬件加速的合成线程滚动
   通道，参数调得再准也比不过原生滚动的跟手度，低端设备上还会明显掉帧、延迟，这才是
   "不灵敏"的根子，不是触摸区域大小的问题。
   改成 touch-action: pan-x：告诉浏览器"这个元素只接管横向平移手势"，横向滑动直接走原生
   滚动（自带真实的惯性衰减和越界橡皮筋回弹，观感就是 iOS 原生的样子），竖直方向的手势
   不被这里拦截，会正常冒泡去滚整个页面，不会出现"划到这排标签就滑不动整页"的问题。 */
.genre-chips { display: flex; flex: 1 1 auto; min-width: 0; justify-content: safe center; overflow-x: auto; white-space: nowrap; margin-left: 0; padding: 2px 0; -webkit-overflow-scrolling: touch; scrollbar-width: none; touch-action: pan-x; overscroll-behavior-x: contain; }
.genre-chips::-webkit-scrollbar { display: none; }
.genre-chips:empty { display: none; margin: 0; }
.genre-chip { flex: 0 0 auto; margin-right: 6px; padding: 4px 11px; border-radius: 8px; font-size: 12px; background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--ink-dim); }
.genre-chip.active { background: var(--accent-soft); border-color: var(--accent-line); color: var(--ink); font-weight: 600; }

/* 区块 */
.section { padding: 12px 0 0; }
.section-head { display: flex; align-items: center; margin-bottom: 10px; padding: 0 var(--gut); }
.section-title { display: none; }
.section-sub { display: none; }
.clear-search { margin-left: auto; flex: 0 0 auto; padding: 5px 12px; border-radius: 9px; background: var(--panel-soft); border: 1px solid var(--line); font-size: 12px; color: var(--ink-dim); }

.rail { display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; padding-bottom: 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.rail .card { flex: 0 0 auto; width: 132px; margin-right: 0; white-space: normal; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--card-gut); margin: 0; padding: 0 var(--card-gut); align-items: start; width: 100%; min-width: 0; overflow: hidden; }
.grid .card { width: auto; max-width: none; min-width: 0; margin: 0; box-sizing: border-box; }

.poster { position: relative; width: 100%; padding-top: 150%; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border: 1px solid var(--line); box-shadow: 0 4px 12px rgba(8,24,64,.38); }
.poster img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
.poster .ph { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 26px; font-weight: 800; text-align: center; padding: 8px; }
.card-del { position: absolute; top: 5px; right: 5px; width: 19px; height: 19px; border-radius: 50%; border: none; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; line-height: 1; display: flex; align-items: center; justify-content: center; z-index: 3; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
.card-del:active { background: var(--bad, #ff5c66); }
.recent-clear-btn { flex: 0 0 auto; margin-left: auto; width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: var(--ink-dim); -webkit-tap-highlight-color: transparent; }
.recent-clear-btn:active { color: var(--bad, #ff5c66); }
.badge { position: absolute; top: 7px; left: 7px; padding: 2px 7px; border-radius: 6px; background: var(--badge-bg); border: 1px solid var(--badge-border); color: var(--accent-ink); font-size: 9.5px; font-weight: 800; letter-spacing: .02em; box-shadow: 0 2px 8px var(--badge-shadow); }
.card-title { margin-top: 8px; font-size: 14px; font-weight: 700; letter-spacing: -.2px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { display: none; }
.card { transition: transform .12s ease; }
.tv-mode .card.focus .poster { box-shadow: 0 0 0 3px var(--accent); }
.tv-mode .card.focus { transform: translateY(-2px) scale(1.02); }

.notice { margin: 12px 16px; padding: 16px; background: var(--panel-soft); border: 1px solid var(--line); border-radius: var(--radius); }
.notice h4 { margin: 0 0 6px; font-size: 14px; }
.notice p { margin: 0 0 10px; font-size: 13px; color: var(--ink-dim); }
.notice .link { color: var(--accent); font-weight: 700; }
.loading-row { padding: 26px 16px; text-align: center; color: var(--ink-faint); font-size: 13px; }

/* 详情 / 资源浮层 —— 满幅海报英雄区（参考 HBO/Emby） */
.sheet { position: fixed; top: 0; right: 0; bottom: 0; left: 0; inset: 0; z-index: 60; display: none; background: transparent; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
.sheet.active { display: block; }
body.detail-active .app { visibility: hidden; pointer-events: none; }
body.detail-active { background: var(--ed-bg, var(--sheet-bg)); transition: background-color 1.1s ease; }

.ed-hero { position: fixed; inset: 0; z-index: -2; overflow: hidden; background: var(--ed-bg, #070b1a); }
.ed-hero-imgs { position: absolute; inset: 0; }
.ed-hero-imgs img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 18%;
  transform: scale(1.06); opacity: 0; transition: opacity 1.1s ease, filter .2s linear; }
.ed-hero-imgs img.active { opacity: 1; }
.ed-hero-imgs img.active.first-in { animation: heroIn 1.1s cubic-bezier(.2,.7,.2,1) forwards, heroBreathe 11s ease-in-out 1.1s infinite; }
.ed-hero-imgs img.active:not(.first-in) { animation: heroBreathe 11s ease-in-out infinite; }
@keyframes heroIn { from { transform: scale(1.14); opacity: 0; } to { transform: scale(1.06); opacity: 1; } }
@keyframes heroBreathe { 0%, 100% { transform: scale(1.06); } 50% { transform: scale(1.12); } }
@media (prefers-reduced-motion: reduce) { .ed-hero-imgs img.active, .ed-hero-imgs img.active.first-in { animation: none; } }
.ed-hero.contain .ed-hero-imgs img { object-fit: contain; object-position: center top; }
/* 贴底那截跟首页轮播同一套思路：颜色不再写死 rgba(6,5,10,.85)，改用当前海报自动取色算出来的
   --ed-bg-rgb / --ed-bg，让详情页背景也跟着每张海报的主色走，不再是固定藏青色兜底。
   没算出颜色前用 6,5,10 / var(--sheet-bg) 兜底，跟改之前效果一致，不会有空档。
   之前这里用 radial-gradient（椭圆，中心在顶部）来同时兼顾顶部轻微压暗和底部融合，
   代价是椭圆形状离中心越远（也就是画面两侧靠下的角落）衰减越快，中间又相对"漏"得更久，
   肉眼看上去底部是一个"U 型"的糊/暗区，跟首页轮播那种不分左右、只看高度的"平行"糊
   完全是两套观感，而且这一层本身根本没用 backdrop-filter，只是纯色渐变压暗，压根没有模糊。
   这里拆成两层，跟首页 .hero-shade / .hero-blend 的结构一一对应：
   ed-hero-shade 只负责顶部一丝丝压暗（不模糊，纯黑到透明，跟首页 hero-shade 的顶部渐变同理），
   ed-hero-blend 负责底部——真正用 backdrop-filter 把背后的海报本身模糊掉，再叠一层从透明到
   实色的动态色渐变，且渐变方向是 to bottom（水平等高线，不分左右），这样详情页底部就和
   首页轮播的底部融合是同一种"平行模糊"，不再是圆形衰减出来的 U 型效果。 */
.ed-hero-shade { position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(to bottom, rgba(0,0,0,.32) 0%, rgba(0,0,0,.08) 18%, transparent 30%); }
.ed-hero-blend {
  position: absolute; left: 0; right: 0; bottom: 0; height: 72%; z-index: 1; pointer-events: none;
  -webkit-backdrop-filter: blur(36px) saturate(1.12);
  backdrop-filter: blur(36px) saturate(1.12);
  background: linear-gradient(to bottom,
    rgba(var(--ed-bg-rgb, 6,5,10), 0) 0%,

function pickBest() {
  var order = { quark: 0, uc: 1, baidu: 2, aliyun: 2, "123": 3, xunlei: 3, "115": 4, tianyi: 4, mobile: 5 };
  var STATE_BONUS = { ok: -3, checking: 0, uncertain: 0, idle: 0 }; // 已验证可播的优先，检测失效的已在上面排除
  var best = null, bestScore = 999;
  state.panItems.forEach(function (it) {
    if (it.state === "bad") return;
    // 枫叶是在线点播（m3u8 直链），点开就能看，不用等网盘解析/检测，优先级排在所有网盘之前

    var s = it._fy ? -2 : ((order[it.type] == null ? 6 : order[it.type]) - (it.tier || 0) * 0.1);
    if (!playable) s += 10;                 // 不支持直接播放的网盘排后
    s += (STATE_BONUS[it.state] != null ? STATE_BONUS[it.state] : 0); // 检测结果加权：已验证 ok 的优先

/* ---------- 网盘检测（自动，受“增强功能 -> 网盘检测”开关控制） ---------- */
function scheduleCheck() {
  if (!state.driveCheck || !state.sdkReady || !window.fm || !fm.pan || !fm.pan.check) return;
  var list = $("panList"); if (!list) return;
  if ("IntersectionObserver" in window) {
    if (!state.panObserver) {
      state.panObserver = new IntersectionObserver(function (entries) {
        var due = [];
        entries.forEach(function (en) {
          var idx = parseInt(en.target.getAttribute("data-pan-index"), 10);
          var it = state.panItems[idx];
          if (!en.isIntersecting) return;
          state.panObserver.unobserve(en.target);
          if (!it || it._checked || it._checking) return;
          if (CHECKABLE.indexOf(it.type) < 0) { it._checked = true; return; }  // 仅检测 App 支持的网盘类型
          due.push(it);
        });
        if (due.length) queuePanCheck(due);
      }, { root: null, rootMargin: "200px 0px", threshold: 0.01 });
    }
    var rows = list.querySelectorAll(".pan-item[data-pan-index]");
    for (var i = 0; i < rows.length; i++) {
      var idx = parseInt(rows[i].getAttribute("data-pan-index"), 10);
      var it = state.panItems[idx];
      if (it && !it._checked && !it._checking) state.panObserver.observe(rows[i]);
    }
  } else {
    // 不支持 IntersectionObserver 的旧内核兜底：直接检测当前可见列表（数量本身有限）
    var fallback = [];
    state.panItems.forEach(function (it) { if (!it._checked && !it._checking && CHECKABLE.indexOf(it.type) >= 0) fallback.push(it); });
    if (fallback.length) queuePanCheck(fallback);
  }
}
function queuePanCheck(items) {
  var token = state.panToken;
  items.forEach(function (it) { it._checking = true; it.state = "checking"; });
  updateDots();
  function resolveOne(it) {
    if (it.url) return Promise.resolve(it);
    if (!it.token) { it._resolveFailed = true; return Promise.resolve(it); }
    return resolveToken(it.token).then(function (url) { it.url = url; return it; }, function () { it._resolveFailed = true; return it; });
  }
  Promise.all(items.map(resolveOne)).then(function (resolved) {
    if (token !== state.panToken) return;
    var checkable = [], skipped = [];
    resolved.forEach(function (it) { if (it.url && !it._resolveFailed) checkable.push(it); else skipped.push(it); });
    skipped.forEach(function (it) { it._checking = false; it._checked = true; it.state = "bad"; });
    if (!checkable.length) { reorderByHealth(); paintResources(); updatePlayButton(); return; }
    function runBatch(start) {
      var batch = checkable.slice(start, start + 10);   // 单批最多约 10 条
      if (!batch.length) { reorderByHealth(); paintResources(); updatePlayButton(); return; }
      var payload = batch.map(function (it) { return { type: it.type, url: it.url, password: it.password || "" }; });
      fm.pan.check(payload).then(function (res) {
        if (token !== state.panToken) return;
        var results = (res && res.results) || [];
        batch.forEach(function (it, i) {
          var r = results[i];
          it._checking = false; it._checked = true;
          it.state = (r && r.state) || "uncertain";
        });
        runBatch(start + 10);
      }, function () {
        if (token !== state.panToken) return;
        batch.forEach(function (it) { it._checking = false; it._checked = true; it.state = "uncertain"; });
        runBatch(start + 10);
      });
    }
    runBatch(0);
  });
}
function updateDots() {
  var rows = $("panList").querySelectorAll(".pan-item");
  for (var i = 0; i < rows.length; i++) {
    var idx = parseInt(rows[i].getAttribute("data-pan-index"), 10);
    var it = state.panItems[idx]; if (!it) continue;
    var dot = rows[i].querySelector(".pan-dot"); if (dot) dot.className = "pan-dot " + (it.state || "idle");
  }
}
function reorderByHealth() {
  // 检测完自动把 ok 状态的资源顶到最前，失效/未知靠后；同状态内部保持原有相对顺序（稳定排序）
  var rank = { ok: 0, checking: 1, uncertain: 1, idle: 1, resolving: 1, bad: 2 };
  var arr = state.panItems.map(function (it, i) { return { it: it, i: i }; });
  arr.sort(function (a, b) {
    var ra = rank[a.it.state] != null ? rank[a.it.state] : 1;
    var rb = rank[b.it.state] != null ? rank[b.it.state] : 1;
    return ra !== rb ? ra - rb : a.i - b.i;
  });
  state.panItems = arr.map(function (x) { return x.it; });
}

/* 枫叶（在线点播）：按开发文档用 fm.vodInline 推送——

   ② episodes 是整条至臻4k线路的全集，原生播放页会显示集数/上一集/下一集；
   ③ 每集 resolve:true + pageUrl，进播放页不批量解析，点哪集才回调 __fmWebHomeInlineResolver
      去破解那一集的真实 m3u8 —— 这才是"点一集播一集、像在网站上直接点播"的正确做法，
      也避免了之前"进详情就想把所有集都解析、慢且常失败"的问题。 */
function playFyResource(item) {

    playFyResourceFallback(item, showName, pic);

  }

  var sameLine = (state.panItems || []).filter(function (it) {
    return it._fy && it._fyId === item._fyId && (it.quality || "") === (item.quality || "");
  }).sort(function (a, b) { return (a._fySid - b._fySid) || (a._fyNid - b._fyNid); });
  if (!sameLine.length) sameLine = [item];

  var episodes = sameLine.map(function (it) {
    var nm = it.title || ("第" + it._fyNid + "集");
    return {
      name: nm,
      url: it._fyPlayPage,        // 集数页面地址（不是最终媒体）
      pageUrl: it._fyPlayPage,    // 按集解析时建议填
      resolve: true,              // 点该集才回调解析真实地址
      ext: { sid: it._fySid, nid: it._fyNid, id: it._fyId }

// 跳到另一个条目等）都会在原生历史栈里悄悄多出一条不对应任何界面的“幽灵记录”。

// 一旦深度因为这些幽灵记录而错位，某次手势返回就可能判断“没有可返回的页面”，
// 于是走了原生兜底逻辑——直接退出沉浸式全屏，而不是把事件交回页面触发 popstate。
