async function searchSite(s,q){let ekw=encodeURIComponent(q);let tmpl=s.searchUrl?[s.searchUrl.replace('{keyword}','{kw}').replace('{page}','{p}')]:(_searchUrlCache[s.id]?[_searchUrlCache[s.id],...SEARCH_URL_TMPL.filter(t=>t!==_searchUrlCache[s.id])]:SEARCH_URL_TMPL);if(aggregate&&tmpl.length>2)tmpl=tmpl.slice(0,2);let ts=aggregate?12:18,bestList=[];for(let tpl of tmpl){let path=tpl.replace(/\{kw\}/g,ekw).replace(/\{p\}/g,'1');try{let r=await get(s,path,ts,true),d=doc(r.html),els=_pickSearchEls(d,s);let list=els.map(e=>cardFrom(e,r.base,s)).filter(x=>x.href&&x.title).slice(0,20);if(list.length){if(!s.searchUrl&&_searchUrlCache[s.id]!==tpl){_searchUrlCache[s.id]=tpl;_saveSearchUrlCache()}return list}if(els.length&&!bestList.length)bestList=list}catch(e){}}return bestList}

async function search(q,opts){opts=opts||{};let targetYear=opts.year?String(opts.year):'';content.innerHTML='<div class="empty">聚合搜索中…</div>';let arr=[],map=new Map(),done=0,shown=false,total=aggregate?SITES.length:1;function mergeOne(list){if(targetYear)list=list.filter(x=>{let yr=extractYear(x);return !yr||yr===targetYear});if(aggregate){list.forEach(x=>{let yr=extractYear(x),k=x.siteId+'|'+normName(x.title)+'|'+yr;if(!map.has(k))map.set(k,Object.assign({},x,{sources:[x]}));else map.get(k).sources.push(x)})}else{list.forEach(x=>{let k=x.href||normName(x.title);if(!map.has(k))map.set(k,x)})}}function flush(){if(shown)return;shown=true;arr=[...map.values()];renderGrid(arr,false);status.textContent=`搜索：${q} · ${arr.length} 条`}function tick(){done++;arr=[...map.values()];if(!shown&&arr.length){flush()}else if(shown){renderGrid(arr,false);status.textContent=`搜索：${q} · ${arr.length} 条 · ${done}/${total}`}if(done>=total&&!shown){flush();status.textContent=`搜索：${q} · ${arr.length} 条`}}if(aggregate){SITES.forEach(s=>{searchSite(s,q).then(list=>{mergeOne(list);tick()}).catch(()=>{tick()})})}else{searchSite(site(),q).then(list=>{mergeOne(list);flush()}).catch(()=>{content.innerHTML='<div class="empty">搜索失败</div>'})}}
function panType(u){u=String(u||'').toLowerCase();if(u.includes('pan.baidu'))return'百度';if(u.includes('drive.uc'))return'U C';if(u.includes('quark'))return'夸克';if(u.includes('aliyun')||u.includes('alipan'))return'阿里';if(u.includes('xunlei'))return'迅雷';if(u.includes('115.com'))return'115';if(u.includes('123'))return'123';if(u.includes('cloud.189'))return'天翼';if(u.includes('caiyun')||u.includes('139'))return'移动';return'网盘'}
async function parseDetail(v){let sources=v.sources||[v],all=[];let main=null;async function tryParse(s,href){let r=await get(s,href),d=doc(r.html);return{r,d}}for(let src of sources.slice(0,5)){let s=SITES.find(x=>x.id===src.siteId)||site();let href=src.href;let pm=href.match(/\/vod\/play\/id\/(\d+)/);if(pm)href='/index.php/vod/detail/id/'+pm[1]+'.html';let rd=null;try{rd=await tryParse(s,href)}catch(e1){let m=href.match(/(?:\/voddetail\/|id\/(\d+)|vod\/(\d+))/);if(m){let id=m[1]||m[2];if(id){try{rd=await tryParse(s,'/index.php/vod/detail/id/'+id+'.html')}catch(e2){}if(!rd){try{rd=await tryParse(s,'/voddetail/'+id+'.html')}catch(e3){}}}}}if(!rd)continue;let{r,d}=rd;if(!main){let title=stripTitleNoise(clean(d.querySelector('h1,.title,.module-info-heading h1')?.textContent))||src.title,pic=imgUrl(d.querySelector('.module-info-poster img,.detail-pic img,img')?.getAttribute('src')||src.pic),desc=clean(d.querySelector('.module-info-introduction,.desc,.module-info-content')?.textContent)||'';main={title,pic:abs(r.base,pic),desc,siteName:src.siteName}}let txtEls=[...d.querySelectorAll(s.detailPanSelector||'.module-row-info p')];txtEls.forEach(p=>{let t=clean(p.textContent);if(/^https?:/.test(t))all.push({name:src.siteName+' · '+panType(t),url:t,type:panType(t),siteName:src.siteName})});[...d.querySelectorAll('a[href]')].forEach(a=>{let u=a.getAttribute('href')||'';if(/pan\.baidu|quark|aliyun|alipan|xunlei|115\.com|115cdn|123|cloud\.189|caiyun|drive\.uc\.cn|magnet:/i.test(u))all.push({name:src.siteName+' · '+(clean(a.textContent)||panType(u)),url:abs(r.base,u),type:panType(u),siteName:src.siteName})});let RAW=(r.html||'').replace(/\\\//g,'/'),PAN_RE=/https?:\/\/(?:[\w.-]*\.)?(?:pan\.baidu\.com|pan\.quark\.cn|drive\.uc\.cn|aliyundrive\.com|alipan\.com|aliyunpan\.com|cloud\.189\.cn|115\.com|115cdn\.[a-z0-9]+|123[a-z0-9]*\.(?:com|cn|net)|caiyun\.139\.com|pan\.xunlei\.com|mypikpak\.com|lanzou[a-z]*\.[a-z]+)\/[A-Za-z0-9\-_/?=&%.#~+]*/gi,mm;while((mm=PAN_RE.exec(RAW))){let u=mm[0].replace(/&amp;/g,'&').replace(/[，。、）)]+$/,'');all.push({name:src.siteName+' · '+panType(u),url:u,type:panType(u),siteName:src.siteName})}}let seen=new Set();all=all.filter(x=>x.url&&!seen.has(x.url)&&(seen.add(x.url)||true));return{info:main||v,pans:all}}

let _tmdbDead=false,_tmdbFail=0;
function _fmReady(){return window.fm?Promise.resolve(window.fm):new Promise(res=>{let t=0;let iv=setInterval(()=>{t+=60;if(window.fm||t>4000){clearInterval(iv);res(window.fm||null)}},60)})}
async function tmdbJSON(url,timeoutSec=8){if(_tmdbDead)throw new Error('tmdb-skip');let fm=await _fmReady();try{let data;if(fm&&fm.req){let r=await fm.req(url,{method:'GET',headers:{},responseType:'text',timeout:timeoutSec});if(!r||!r.ok)throw new Error((r&&r.error)||('HTTP '+(r?r.status:'?')));data=JSON.parse(r.body)}else{let ac=new AbortController(),t2=setTimeout(()=>ac.abort(),timeoutSec*1000);try{let r=await fetch(url,{signal:ac.signal});data=await r.json()}finally{clearTimeout(t2)}}_tmdbFail=0;return data}catch(e){if(++_tmdbFail>=4)_tmdbDead=true;throw e}}
function tmdbCleanTitle(t){return clean(t).replace(/[\(（\[【][^\)）\]】]*[\)）\]】]/g,'').replace(/[\[\]【】()（）]/g,'').replace(/第[一二三四五六七八九十\d]+[季部]|Season\s*\d+/ig,'').replace(/\s{2,}/g,' ').replace(/[\s·:：\-—_、,，。.]+$/,'').trim()}
function tmdbNormForMatch(s){return(s||'').toLowerCase().replace(/[\s·:：\-—_、,，。.！!?？'"'""'""()（）\[\]【】]/g,'')}
function tmdbTitleMatches(query,candidate){let q=tmdbNormForMatch(query),c=tmdbNormForMatch(candidate);if(!q||!c)return false;if(q===c)return true;if(q.length<=2||c.length<=2)return q===c;return q.includes(c)||c.includes(q)}
const _tmdbCache=new Map();
async function tmdbMatchItem(title,year){let q=tmdbCleanTitle(title);if(!q)return null;try{let d=await tmdbJSON(`${TMDB_API}/search/multi?api_key=${TMDB_KEY}&language=zh-CN&query=${encodeURIComponent(q)}`),results=d.results||[],yearOf=x=>String(x.release_date||x.first_air_date||'').slice(0,4),titleMatched=results.filter(x=>x.poster_path&&tmdbTitleMatches(q,x.title||x.name||x.original_title||x.original_name||''));if(year){let exact=titleMatched.find(x=>yearOf(x)===year);if(exact)return exact}if(titleMatched.length)return titleMatched[0];let withPoster=results.filter(x=>x.poster_path);if(year){let ey=withPoster.find(x=>yearOf(x)===year);if(ey)return ey}if(results.length<=3&&withPoster.length)return withPoster[0]}catch(e){}return null}
async function tmdbMatchCached(title,year){let ct=tmdbCleanTitle(title);if(!ct)return null;let key=ct+'|'+(year||'');if(_tmdbCache.has(key))return _tmdbCache.get(key);let p=tmdbMatchItem(title,year);_tmdbCache.set(key,p);return p}

function renderSugg(list){if(!list.length){hideSugg();return}searchSugg.innerHTML=list.map(s=>`<div class="sugg-item"><div class="sugg-poster">${s.poster?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(s.poster)}" alt="" onerror="this.onerror=null;this.outerHTML='<span class=ph>🎬</span>'">`:'<span class="ph">🎬</span>'}</div><div class="sugg-info"><div class="sugg-title">${esc(s.title)}</div><div class="sugg-meta">${s.type?`<span class="sugg-type">${mediaTypeLabel(s.type,s.genres)}</span>`:''}${s.year?`<span class="sugg-year">${esc(s.year)}</span>`:''}</div></div></div>`).join('');[...searchSugg.children].forEach((el,i)=>{el.addEventListener('click',()=>{let s=list[i];kw.value=s.title;hideSugg();kw.blur();search(s.title,s.year?{year:s.year}:undefined)})});let r=searchForm.getBoundingClientRect();searchSugg.style.left=r.left+'px';searchSugg.style.top=(r.bottom+8)+'px';searchSugg.style.width=r.width+'px';searchSugg.classList.add('show')}

let _coverTimer=null,_coverIdx=0,_coverUrls=[];

async function loadTmdbExtras(tmdbId,mediaType){let type=mediaType==='tv'?'tv':'movie';try{let d=await tmdbJSON(`${TMDB_API}/${type}/${tmdbId}?api_key=${TMDB_KEY}&language=zh-CN&append_to_response=credits,recommendations,images&include_image_language=zh,null,en`);if(!d)return;let logo=d.images&&d.images.logos;if(logo&&logo.length){let best=logo.sort((a,b)=>(b.vote_average||0)-(a.vote_average||0))[0];if(best&&best.file_path){let l=document.getElementById('detLogo'),t=document.getElementById('detTitle')||document.querySelector('.det-info .title');if(l){l.src=TMDB_IMG_FULL+best.file_path;l.classList.remove('hidden');l.onerror=()=>{l.classList.add('hidden')}}if(t)t.classList.add('hidden')}}let backdrops=(d.images&&d.images.backdrops||[]).map(b=>TMDB_IMG_FULL+b.file_path).filter(Boolean).slice(0,5);let poster=d.poster_path?TMDB_IMG_FULL+d.poster_path:'';let urls=[poster,...backdrops].filter(Boolean);if(urls.length>1)startCoverRotation(urls);let cast=(d.credits&&d.credits.cast||[]).filter(p=>p.profile_path).slice(0,10);if(cast.length){$('#detCast').style.display='';let h=cast.map(p=>`<div class="cast-card" data-search="${esc(p.name)}"><img loading="lazy" referrerpolicy="no-referrer" src="${TMDB_IMG_SUGG+p.profile_path}" onerror="this.style.display='none'"><div class="cast-name">${esc(p.name)}</div><div class="cast-role">${esc(p.character||'')}</div></div>`).join('');$('#detCastList').innerHTML=h;$('#detCastList').querySelectorAll('.cast-card').forEach(c=>c.onclick=()=>{let q=c.dataset.search;if(q){kw.value=q;closeDetail();search(q)}})}let recs=(d.recommendations&&d.recommendations.results||[]).filter(x=>x.poster_path).slice(0,18);if(recs.length){$('#detRec').style.display='';let h=recs.map(x=>`<article class="rec-card" data-search="${esc(x.title||x.name||'')}"><img loading="lazy" referrerpolicy="no-referrer" src="${TMDB_IMG_SUGG+x.poster_path}" onerror="this.style.display='none'"><div class="rec-title">${esc(x.title||x.name||'')}</div></article>`).join('');$('#detRecGrid'
